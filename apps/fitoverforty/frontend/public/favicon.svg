<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.8 -0.2 96 96">
  <!--
    Squared around the bell's own centre (52.8, 47.8) so the mark is not
    lopsided inside a square icon.

    The counter is deliberately absent: three characters across 32 pixels stop
    being readable and start being texture, while the bell alone reads at 16.

    Two fills rather than currentColor, because a favicon has no page around it
    to inherit from. The browser reports which way its own chrome is going
    instead, so the mark stays legible against either.
  -->
