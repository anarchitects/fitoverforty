<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fit Over Forty - Your Fitness Journey Starts Here</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Fitness and wellness for people over forty"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      SVG first, because it is the only one that can follow the browser's own
      light/dark chrome - it carries a prefers-color-scheme rule, which a raster
      icon cannot. The .ico is the fallback for browsers that ignore it, and
      carries 16 and 32 so neither is a downscale of the other. Neither shows
      the 40+: three characters across 32 pixels is texture, not a counter.
    -->
    <!--
      The feed has existed since the blog shipped and nothing pointed at it, so
      no browser or reader could find it without being told the URL. This is
      the only way feed discovery works: readers look for exactly this element.
    -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Fit Over Forty"
      href="/blog/feed.xml"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      Applies the theme before first paint.

      Inline and synchronous on purpose: anything deferred - a script file, or
      waiting for Angular - paints the light theme first and then repaints, so a
      dark-theme reader gets a white flash on every navigation. This is the one
      case where a blocking inline script is the accessible option.

      It writes `data-anx-theme` before the design system's own DOM sync runs;
      that sync only sets the attribute when it is absent, so this wins without
      fighting it. Wrapped in try/catch because reading localStorage throws
      outright in some privacy configurations, and a failure here must not stop
      the page rendering.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fitoverforty-theme');
          var dark =
            stored === 'fitoverforty-dark' ||
            (stored === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-anx-theme',
            dark ? 'fitoverforty-dark' : 'fitoverforty',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-anx-theme', 'fitoverforty');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
