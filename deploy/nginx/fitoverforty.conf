# Nginx site for the deployed blog. Nginx terminates TLS and proxies plain
# HTTP to the pm2-managed Node process; that process serves both the
# server-rendered pages and the API, so there is only one upstream.

upstream fitoverforty {
    # Must match PORT in the artefact's .env.
    server 127.0.0.1:3000;
    keepalive 16;
}

# Anything arriving under a name this file does not claim is dropped without a
# response. This is half of what makes `Host` trustworthy: the app trusts
# X-Forwarded-Proto, and `Host` reaches it unmodified, so the edge has to be
# what guarantees the name is one of ours. WEB_ALLOWED_HOSTS in the app is the
# other half, and neither is redundant — this block is bypassed entirely if
# anything ever reaches the port directly.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/fitoverforty.crt;
    ssl_certificate_key /etc/ssl/private/fitoverforty.key;

    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name fitoverforty.blog www.fitoverforty.blog;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fitoverforty.blog www.fitoverforty.blog;

    ssl_certificate     /etc/letsencrypt/live/fitoverforty.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitoverforty.blog/privkey.pem;

    # The editor accepts images up to 8 MiB and answers a readable error above
    # that. Nginx's default is 1m, which would turn every ordinary photo into
    # its own generic 413 page before the app ever saw the request; the margin
    # over 8m covers multipart framing so the app's message is what an author
    # gets.
    client_max_body_size 9m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://fitoverforty;
        proxy_http_version 1.1;

        # `Host` is passed through unchanged: the app reads the public
        # hostname from it, and rewriting it here would make every canonical
        # URL, feed link and sitemap entry point at the upstream.
        proxy_set_header Host              $host;

        # $scheme, not $http_x_forwarded_proto: this overwrites whatever the
        # caller sent rather than appending to it. The app trusts this header
        # (trustProxyHeaders in the Angular SSR engine), so a value that could
        # come from outside would be an SSRF vector.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}

# Not done here, deliberately: serving dist/.../browser from Nginx directly.
# The filenames are content-hashed and would cache beautifully, but splitting
# the artefact across two servers means two things to keep in step for a blog
# whose assets are around 110 kB. Revisit if that stops being true.
