name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fitoverforty
          POSTGRES_PASSWORD: fitoverforty
          POSTGRES_DB: fitoverforty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitoverforty -d fitoverforty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TYPEORM_HOST: localhost
      TYPEORM_PORT: '5432'
      TYPEORM_USERNAME: fitoverforty
      TYPEORM_PASSWORD: fitoverforty
      TYPEORM_DATABASE: fitoverforty
      # The backend refuses to construct Better Auth without a signing secret,
      # deliberately — see apps/fitoverforty/backend/env.example. CI boots the
      # backend (frontend-e2e and ssr-e2e both do), so it needs one. Nothing in
      # CI signs in, and this value is public by definition, so it is written
      # here rather than kept as a secret: a repository secret would imply it
      # protects something.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-real-session-0123
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - run: corepack enable

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: yarn dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn playwright install --with-deps

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: yarn nx record -- echo Hello World
      # When you enable task distribution, run the e2e-ci task instead of e2e
      - run: yarn nx run-many -t lint test build e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: yarn nx fix-ci
        if: always()
